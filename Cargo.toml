[package]
name = "caffeinate-windows"
version = "0.1.0"
edition = "2021"
description = "macOS caffeinate for Windows: keep the system or display awake"
license = "MIT"
repository = "https://github.com/OWNER/caffeinate-windows"

[[bin]]
name = "caffeinate"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
