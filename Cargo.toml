[package]
name = "caffeinate-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The macOS caffeinate command for Windows: keep the system or display awake"
license = "MIT"
readme = "README.md"
repository = "https://github.com/OWNER/caffeinate-windows"
homepage = "https://github.com/OWNER/caffeinate-windows"
keywords = ["caffeinate", "sleep", "windows", "power", "cli"]
categories = ["command-line-utilities", "os::windows-apis"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "caffeinate"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Threading",
]

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
