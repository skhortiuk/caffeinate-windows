name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Write SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/caffeinate.exe -Algorithm SHA256).Hash.ToLower()
          "$h  caffeinate.exe" | Out-File -Encoding ascii -NoNewline target/release/caffeinate.exe.sha256
          Get-Content target/release/caffeinate.exe.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caffeinate
          path: |
            target/release/caffeinate.exe
            target/release/caffeinate.exe.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: caffeinate
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            caffeinate.exe
            caffeinate.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
